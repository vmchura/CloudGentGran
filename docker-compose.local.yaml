# Catalunya Data Pipeline - Local Development Environment
# Combines Airflow orchestration with LocalStack AWS services emulation
# Usage: docker-compose -f docker-compose.local.yaml up -d

x-airflow-common:
  &airflow-common
  build: ./orchestration
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-YourFernetKeyHere}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-YourSecretKeyHere}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'

    # LocalStack Integration
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: eu-west-1

    # Environment Variables for DAGs
    AIRFLOW_VAR_ENVIRONMENT: local
    AIRFLOW_VAR_USE_LOCALSTACK: "true"

    # Airflow Connections - LocalStack
    AIRFLOW_CONN_LOCALSTACK_DEFAULT: 'aws://test:test@localstack:4566/?region_name=eu-west-1&endpoint_url=http%3A%2F%2Flocalstack%3A4566'

    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./orchestration/logs:/opt/airflow/logs
    - ./orchestration/config:/opt/airflow/config
    - ./orchestration/plugins:/opt/airflow/plugins
    - ./dbt:/opt/airflow/dbt
    - /var/run/docker.sock:/var/run/docker.sock  # For LocalStack container communication
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - cloudgentgran-local
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy

services:
  # ===========================================
  # PostgreSQL Database for Airflow
  # ===========================================
  postgres:
    image: postgres:13
    container_name: cloudgentgran-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    ports:
      - "5432:5432"
    networks:
      - cloudgentgran-local

  # ===========================================
  # LocalStack - AWS Services Emulator
  # ===========================================
  localstack:
    container_name: cloudgentgran-localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"            # LocalStack Gateway
    environment:
      # Core LocalStack configuration
      - DEBUG=1
      - SERVICES=s3,lambda,cloudformation,iam,logs,sts,events,ssm
      - DOCKER_HOST=unix:///var/run/docker.sock

      # Lambda configuration - optimized for better performance
      - LAMBDA_DOCKER_NETWORK=cloudgentgran-local
      - LAMBDA_RUNTIME_EXECUTOR_TIMEOUT=900

      # Persistence (keeps data between restarts)
      - PERSISTENCE=1
      - SNAPSHOT_SAVE_STRATEGY=ON_SHUTDOWN
      - SNAPSHOT_LOAD_STRATEGY=ON_STARTUP

      # AWS configuration
      - AWS_DEFAULT_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./localstack/volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s
    restart: always
    # Resource allocation for better Lambda performance
    shm_size: '1G'
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'
    networks:
      - cloudgentgran-local

  # ===========================================
  # Apache Airflow - Main Service
  # ===========================================
  airflow:
    <<: *airflow-common
    container_name: cloudgentgran-airflow
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint"]
    command: ["airflow", "standalone"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on

  # ===========================================
  # S3FS - Mount S3 buckets as file systems
  # ===========================================
  s3fs-mounts:
    image: efrecon/s3fs:1.78
    container_name: cloudgentgran-s3fs
    profiles:
      - s3fs
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_REGION=eu-west-1
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3FS_WAIT_TIMEOUT=${S3FS_WAIT_TIMEOUT:-60}
    volumes:
      - s3fs-data:/mnt/s3-data:shared
      - s3fs-results:/mnt/s3-results:shared
      - s3fs-catalog:/mnt/s3-catalog:shared
      - s3fs-service:/mnt/s3-service:shared
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        
        TIMEOUT=$${S3FS_WAIT_TIMEOUT}
        
        echo 'Setting up S3FS credentials...'
        echo 'test:test' > /etc/passwd-s3fs
        chmod 600 /etc/passwd-s3fs
        
        wait_for_bucket() {
          local bucket=$$1
          local elapsed=0
          echo "Waiting for bucket: $$bucket"
          while ! wget -q --spider http://localstack:4566/$$bucket 2>/dev/null; do
            if [ $$elapsed -ge $$TIMEOUT ]; then
              echo "ERROR: Timeout waiting for $$bucket - bucket does not exist"
              exit 1
            fi
            sleep 2
            elapsed=$$((elapsed + 2))
          done
          echo "Bucket $$bucket is ready"
        }
        
        echo 'Waiting for all buckets to be ready...'
        wait_for_bucket catalunya-data-dev
        wait_for_bucket catalunya-athena-results-dev
        wait_for_bucket catalunya-catalog-dev
        wait_for_bucket catalunya-service-dev
        
        echo 'All buckets ready. Starting S3FS mounts...'
        
        S3FS_OPTS="url=http://localstack:4566,use_path_request_style,allow_other,nonempty"
        
        s3fs catalunya-data-dev /mnt/s3-data -o $${S3FS_OPTS} -f &
        s3fs catalunya-athena-results-dev /mnt/s3-results -o $${S3FS_OPTS} -f &
        s3fs catalunya-catalog-dev /mnt/s3-catalog -o $${S3FS_OPTS} -f &
        s3fs catalunya-service-dev /mnt/s3-service -o $${S3FS_OPTS} -f &
        
        echo 'S3FS mounts started'
        wait
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - cloudgentgran-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mountpoint", "-q", "/mnt/s3-data"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ===========================================
  # Airflow Initialization Service
  # ===========================================
  airflow-init:
    <<: *airflow-common
    container_name: cloudgentgran-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo "Setting AIRFLOW_UID to $(id -u)"
          export AIRFLOW_UID=$(id -u)
        fi
        
        echo "Creating missing directories..."
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        mkdir -p /opt/airflow/dbt/mart/local_data
        chmod -R 777 /opt/airflow/dbt/mart/local_data
        mkdir -p /opt/airflow/dbt/mart/target
        chmod -R 777 /opt/airflow/dbt/mart/target
        
        echo "🔧 Setting up DBT profiles..."
        # Copy profiles_template.yml to profiles.yml if it doesn't exist
        cp /opt/airflow/dbt/mart/profiles_template.yml /opt/airflow/dbt/profiles.yml
        echo "✅ DBT profiles.yml created from template"
        
        # Set DBT target environment
        export DBT_TARGET=${DBT_TARGET:-local}
        echo "🔧 DBT_TARGET set to: $DBT_TARGET"
        
        echo "🔧 Setting file permissions..."
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        
        echo "🔧 Installing additional packages..."
        pip install awscli-local
        
        echo "🔧 Initializing Airflow database..."
        airflow db migrate
        
        echo "🔧 Creating admin user..."
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@catalunya.cat \
          --password admin || echo "Admin user already exists"
        
        echo "🔧 Setting up Airflow variables..."
        airflow variables set environment "local"
        airflow variables set use_localstack "true"
        airflow variables set bucket_name "catalunya-data-dev"
        airflow variables set localstack_endpoint "http://localstack:4566"
        
        echo "🔧 Creating LocalStack AWS connection..."
        airflow connections delete localstack_default || echo "Connection doesn't exist yet"
        airflow connections add \
          --conn-id localstack_default \
          --conn-type aws \
          --conn-extra '{
            "region_name": "eu-west-1",
            "endpoint_url": "http://localstack:4566",
            "aws_access_key_id": "test",
            "aws_secret_access_key": "test",
            "verify": false
          }'
        
        echo "🧪 Testing LocalStack connection..."
        timeout 30s airflow connections test localstack_default || echo "Connection test timed out - this is normal during startup"
        
        echo "🎉 Catalunya Data Pipeline initialization completed!"
        echo "📊 Airflow UI: http://localhost:8080 (admin/admin)"
        echo "🔧 LocalStack UI: http://localhost:4566/_localstack/health"
        echo "🚀 Ready to run Catalunya Social Services DAGs with LocalStack!"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    user: "0:0"
    restart: "no"  # Init service should not restart
    depends_on:
      <<: *airflow-common-depends-on

# ===========================================
# Networks
# ===========================================
networks:
  cloudgentgran-local:
    driver: bridge
    name: cloudgentgran-local

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres-db-volume:
    name: cloudgentgran-postgres-data
  airflow-dbt-profiles:
    name: cloudgentgran-airflow-dbt-profiles
  s3fs-data:
    name: cloudgentgran-s3fs-data
  s3fs-results:
    name: cloudgentgran-s3fs-results
  s3fs-catalog:
    name: cloudgentgran-s3fs-catalog
  s3fs-service:
    name: cloudgentgran-s3fs-service
