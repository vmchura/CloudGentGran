# Catalunya Data Pipeline - Local Development Environment
# Combines Airflow orchestration with MiniStack AWS services emulation
# Usage: docker-compose -f docker-compose.local.yaml up -d

x-airflow-common:
  &airflow-common
  build: ./orchestration
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-YourFernetKeyHere}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-YourSecretKeyHere}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__CORE__TEST_CONNECTION: 'Enabled'

    # Auth - No authentication for local development
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'

    # MiniStack Integration (AWS emulator)
    AWS_ENDPOINT_URL: http://ministack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: eu-west-1

    # Environment Variables for DAGs
    AIRFLOW_VAR_ENVIRONMENT: local
    AIRFLOW_VAR_USE_LOCALSTACK: "true"

    # Airflow connection created by airflow-init (stored in metastore DB, supports
    # proper JSON extras like config_kwargs). Env-var connections would mask it.
    # conn-id kept as localstack_default for DAG compatibility

    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./orchestration/logs:/opt/airflow/logs
    - ./orchestration/config:/opt/airflow/config
    - ./orchestration/plugins:/opt/airflow/plugins
    - ./dbt:/opt/airflow/dbt
    - /var/run/docker.sock:/var/run/docker.sock  # For MiniStack container communication
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - cloudgentgran-local
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    ministack:
      condition: service_healthy

services:
  # ===========================================
  # PostgreSQL Database for Airflow
  # ===========================================
  postgres:
    image: postgres:13
    container_name: cloudgentgran-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"
    networks:
      - cloudgentgran-local

  # ===========================================
  # MiniStack - AWS Services Emulator
  # ===========================================
  ministack:
    container_name: cloudgentgran-ministack
    image: ministackorg/ministack:full
    ports:
      - "4566:4566"            # MiniStack Gateway
    environment:
      # Core MiniStack configuration
      - LOG_LEVEL=DEBUG
      - MINISTACK_REGION=eu-west-1

      # Lambda: run invocations in Docker (warm container pool). The default
      # `local` executor runs Python in-process (no network isolation) but
      # executes provided.* (Rust) bootstraps as bare subprocesses, where the
      # Rust SDK cannot dial back to MiniStack. CDK custom resources also need
      # Docker (cfn-response forces HTTPS+drops port; the fix shim only exists
      # in the docker executor).
      - LAMBDA_EXECUTOR=docker
      - DOCKER_NETWORK=cloudgentgran-local
      # MiniStack injects AWS_ENDPOINT_URL=http://host.docker.internal:4566 into
      # RIE containers; wire the hosts entry so that fallback resolves too
      - LAMBDA_DOCKER_FLAGS=--add-host=host.docker.internal:host-gateway

      # Athena: real SQL via bundled DuckDB engine (full image). Pin so a slim
      # image swap never silently degrades to mock
      - ATHENA_ENGINE=duckdb

      # State persistence across restarts
      - PERSIST_STATE=1
      - STATE_DIR=/var/lib/ministack

      # S3 — S3_PERSIST writes object bytes (not just metadata) to S3_DATA_DIR.
      # Must live under the persisted STATE_DIR mount or object bodies are lost
      # on container recreation while metadata survives (broken half-state).
      - S3_PERSIST=1
      - S3_DATA_DIR=/var/lib/ministack/s3
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "ministack-state:/var/lib/ministack"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:4566/_ministack/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      cloudgentgran-local:
        ipv4_address: 172.30.0.10

  # ===========================================
  # Apache Airflow - Main Service
  # ===========================================
  airflow:
    <<: *airflow-common
    container_name: cloudgentgran-airflow
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint"]
    command: ["airflow", "standalone"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      <<: *airflow-common-depends-on

  # ===========================================
  # Airflow Initialization Service
  # ===========================================
  airflow-init:
    <<: *airflow-common
    container_name: cloudgentgran-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo "Setting AIRFLOW_UID to $(id -u)"
          export AIRFLOW_UID=$(id -u)
        fi
        
        echo "Creating missing directories..."
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        mkdir -p /opt/airflow/dbt/mart/local_data
        chmod -R 777 /opt/airflow/dbt/mart/local_data
        mkdir -p /opt/airflow/dbt/mart/target
        chmod -R 777 /opt/airflow/dbt/mart/target
        
        echo "🔧 Setting up DBT profiles..."
        # Copy profiles_template.yml to profiles.yml if it doesn't exist
        cp /opt/airflow/dbt/mart/profiles_template.yml /opt/airflow/dbt/profiles.yml
        echo "✅ DBT profiles.yml created from template"
        
        # Set DBT target environment
        export DBT_TARGET=$${DBT_TARGET:-local}
        echo "🔧 DBT_TARGET set to: $${DBT_TARGET}"
        
        echo "🔧 Setting file permissions..."
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        
        echo "🔧 Running dbt deps..."
        cd /opt/airflow/dbt/mart && dbt deps
        echo "✅ dbt deps completed"
        
        echo "🔧 Initializing Airflow database..."
        airflow db migrate
        
        echo "🔧 Setting up Airflow variables..."
        airflow variables set environment "local"
        airflow variables set use_localstack "true"
        airflow variables set bucket_name "catalunya-data-dev"
        airflow variables set localstack_endpoint "http://ministack:4566"
        
        echo "🔧 Creating MiniStack AWS connection (conn-id kept as localstack_default for DAG compatibility)..."
        airflow connections delete localstack_default || echo "Connection doesn't exist yet"
        airflow connections add \
          --conn-id localstack_default \
          --conn-type aws \
          --conn-extra '{
            "region_name": "eu-west-1",
            "endpoint_url": "http://ministack:4566",
            "aws_access_key_id": "test",
            "aws_secret_access_key": "test",
            "verify": false,
            "config_kwargs": {"read_timeout": 900, "connect_timeout": 60}
          }'
        
        echo "🧪 Testing MiniStack connection..."
        timeout 30s airflow connections test localstack_default || echo "Connection test timed out - this is normal during startup"
        
        echo "🎉 Catalunya Data Pipeline initialization completed!"
        echo "📊 Airflow UI: http://localhost:8080 (no auth required)"
        echo "🔧 MiniStack UI: http://localhost:4566/_ministack/health"
        echo "🚀 Ready to run Catalunya Social Services DAGs with MiniStack!"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      # Airflow is pip-installed under the airflow user's site-packages;
      # without this HOME the root-run init gets ModuleNotFoundError
      HOME: /home/airflow
    user: "0:0"
    depends_on:
      <<: *airflow-common-depends-on

# ===========================================
# Networks
# ===========================================
networks:
  cloudgentgran-local:
    driver: bridge
    name: cloudgentgran-local
    # Fixed subnet so ministack can keep a static IP — Rust (hyper) lambdas in
    # RIE containers can't resolve docker's embedded DNS (getaddrinfo EBUSY),
    # so they need an IP-literal AWS_ENDPOINT_URL
    ipam:
      config:
        - subnet: 172.30.0.0/16

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres-db-volume:
    name: cloudgentgran-postgres-data
  ministack-state:
    name: cloudgentgran-ministack-state
  airflow-dbt-profiles:
    name: cloudgentgran-airflow-dbt-profiles
