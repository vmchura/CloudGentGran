name: Catalunya Data Pipeline - CI/CD

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'infrastructure/**'
      - 'lambda/**'
      - '.github/workflows/**'
      - '!lambda/transformers/**/*.md'
      - '!lambda/mart/**/*.md'
      - '!lambda/extractors/**/*.md'
      - '!lambda/catalog/**/*.md'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'infrastructure/**'
      - 'lambda/**'
      - '.github/workflows/**'
      - '!lambda/transformers/**/*.md'
      - '!lambda/mart/**/*.md'
      - '!lambda/extractors/**/*.md'
      - '!lambda/catalog/**/*.md'

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================
  # DETECT CHANGES
  # ==========================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      rust-lambda: ${{ steps.filter.outputs.rust-lambda }}
      python-lambda: ${{ steps.filter.outputs.python-lambda }}
      any-cdk: ${{ steps.filter.outputs.infrastructure || steps.filter.outputs.rust-lambda || steps.filter.outputs.python-lambda }}
      should-build: ${{ steps.build-check.outputs.should-build }}
      should-deploy-dev: ${{ steps.deploy-check.outputs.should-deploy-dev }}
      should-deploy-prod: ${{ steps.deploy-check.outputs.should-deploy-prod }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.repository.default_branch || 'develop' }}
          filters: |
            infrastructure:
              - 'infrastructure/**'
            rust-lambda:
              - 'lambda/transformers/**/*.rs'
              - 'lambda/transformers/**/Cargo.toml'
              - 'lambda/transformers/**/Cargo.lock'
              - 'lambda/mart/**/*.rs'
              - 'lambda/mart/**/Cargo.toml'
              - 'lambda/mart/**/Cargo.lock'
              - 'lambda/validators/**/*.rs'
              - 'lambda/validators/**/Cargo.toml'
              - 'lambda/validators/**/Cargo.lock'
              - 'lambda/Cargo.toml'
              - 'lambda/Cargo.lock'
            python-lambda:
              - 'lambda/extractors/**/*.py'
              - 'lambda/extractors/**/requirements.txt'
              - 'lambda/catalog/**/*.py'
              - 'lambda/catalog/**/requirements.txt'
              - 'lambda/common/**/*.py'

      - name: Check deployment conditions
        id: deploy-check
        run: |
          # Deploy to dev only on push to develop that is a PR merge
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/develop" ]]; then
            if [[ "${{ github.event.head_commit.message }}" == *"Merge pull request"* ]]; then
              echo "should-deploy-dev=true" >> $GITHUB_OUTPUT
              echo "✅ Will deploy to development (PR merge detected)"
            else
              echo "should-deploy-dev=false" >> $GITHUB_OUTPUT
              echo "⏭️ Skipping dev deploy (not a PR merge)"
            fi
          else
            echo "should-deploy-dev=false" >> $GITHUB_OUTPUT
          fi
          
          # Deploy to prod only on push to main
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should-deploy-prod=true" >> $GITHUB_OUTPUT
            echo "✅ Will deploy to production"
          else
            echo "should-deploy-prod=false" >> $GITHUB_OUTPUT
          fi

      - name: Check build conditions
        id: build-check
        run: |
          # Build only on PR merge pushes (not on direct commits or PR events)
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.head_commit.message }}" == *"Merge pull request"* ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "✅ Will build (PR merge detected)"
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping build (not a PR merge)"
          fi

      - name: Summary
        run: |
          echo "## Change Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ steps.filter.outputs.infrastructure || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Lambda | ${{ steps.filter.outputs.rust-lambda || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Lambda | ${{ steps.filter.outputs.python-lambda || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build-check.outputs.should-build }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Dev | ${{ steps.deploy-check.outputs.should-deploy-dev }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Prod | ${{ steps.deploy-check.outputs.should-deploy-prod }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # BUILD RUST LAMBDA (if any CDK-related code changed)
  # ==========================================
  build-rust-lambda:
    name: Build Rust Lambdas
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should-build == 'true' && needs.detect-changes.outputs.any-cdk == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.95.0
          target: x86_64-unknown-linux-gnu
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            lambda/target/
          key: ${{ runner.os }}-cargo-workspace-${{ hashFiles('lambda/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-workspace-

      - name: Install cargo-lambda
        run: |
          if ! command -v cargo-lambda &> /dev/null; then
            cargo install cargo-lambda
          fi

      - name: Install Zig
        run: npm install -g @ziglang/cli

      - name: Build All Rust Lambdas
        working-directory: lambda
        run: |
          echo "🚀 Building all Rust lambdas with workspace..."
          cargo lambda build --release --workspace --target x86_64-unknown-linux-gnu
          echo "✅ All lambdas built!"

      - name: Create deployment packages
        working-directory: lambda
        run: |
          mkdir -p rust_lambda_deployment
          mkdir -p rust_lambda_deployment/social-services-transformer
          mkdir -p rust_lambda_deployment/social-services-validator
          mkdir -p rust_lambda_deployment/population_municipal_greater_65
          mkdir -p rust_lambda_deployment/population_municipal_greater_65_mart
          cp target/lambda/social-services-transformer/bootstrap rust_lambda_deployment/social-services-transformer/bootstrap
          cp target/lambda/social-services-validator/bootstrap rust_lambda_deployment/social-services-validator/bootstrap
          cp target/lambda/population_municipal_greater_65/bootstrap rust_lambda_deployment/population_municipal_greater_65/bootstrap
          cp target/lambda/population_municipal_greater_65_mart/bootstrap rust_lambda_deployment/population_municipal_greater_65_mart/bootstrap
          zip -r rust_lambda_deployment.zip rust_lambda_deployment

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-lambdas-${{ github.sha }}
          path: lambda/rust_lambda_deployment.zip
          retention-days: 1

  # ==========================================
  # BUILD AND TEST JOB
  # ==========================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-rust-lambda ]
    if: always() && needs.detect-changes.outputs.should-build == 'true' && needs.detect-changes.outputs.any-cdk == 'true' && needs.build-rust-lambda.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rust Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-lambdas-${{ github.sha }}
          path: .

      - name: Extract Rust Lambda
        run: |
          unzip -o rust_lambda_deployment.zip
          ls -la rust_lambda_deployment
          echo "✅ Extracted Rust lambda artifact for testing!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        working-directory: ./infrastructure
        run: npm ci

      - name: Run TypeScript build
        working-directory: ./infrastructure
        run: npm run build

      - name: Run tests
        working-directory: ./infrastructure
        run: npm test
        env:
          CDK_LOCAL_BUILD_AND_TEST: true

      - name: Install CDK CLI (LocalStack for act)
        if: ${{ env.ACT }}
        working-directory: ./infrastructure
        run: |
          echo "🐳 Installing cdklocal for LocalStack deployment..."
          npm install -g aws-cdk aws-cdk-local

      - name: Install CDK CLI (AWS for GitHub Actions)
        if: ${{ !env.ACT }}
        working-directory: ./infrastructure
        run: |
          echo "☁️ Installing aws-cdk for AWS deployment..."
          npm install -g aws-cdk

      - name: Configure AWS credentials for synth
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/catalunya-deployment-role-dev
          role-session-name: GitHubActions-Synth-${{ github.run_id }}
          aws-region: eu-west-1
          role-duration-seconds: 900
          mask-aws-account-id: true

      - name: CDK Diff (Syntax Check) - LocalStack
        if: ${{ env.ACT }}
        working-directory: ./infrastructure
        run: |
          echo "🧪 Synthesizing templates for LocalStack..."
          npx cdk synth --all --require-approval never
        env:
          CDK_LOCAL_BUILD_AND_TEST: true

      - name: CDK Diff (Syntax Check) - AWS
        if: ${{ !env.ACT }}
        working-directory: ./infrastructure
        run: |
          echo "☁️ Synthesizing templates for AWS..."
          npx cdk synth --all --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: eu-west-1
          WEB_CERTIFICATE_ID: ${{ secrets.WEB_CERTIFICATE_ID }}

  # ==========================================
  # DEPLOY TO DEVELOPMENT (only on PR merge)
  # ==========================================
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-and-test, build-rust-lambda ]
    if: |
      needs.detect-changes.outputs.should-deploy-dev == 'true' &&
      needs.detect-changes.outputs.any-cdk == 'true' &&
      needs.build-and-test.result == 'success'
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rust Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-lambdas-${{ github.sha }}
          path: .

      - name: Extract Rust Lambda
        run: |
          unzip -o rust_lambda_deployment.zip
          ls -la rust_lambda_deployment
          echo "✅ Extracted Rust lambda artifact!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        working-directory: ./infrastructure
        run: npm ci

      - name: Configure AWS credentials for Development
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/catalunya-deployment-role-dev
          role-session-name: GitHubActions-Development-${{ github.run_id }}
          aws-region: eu-west-1
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Verify AWS identity (AWS only)
        if: ${{ !env.ACT }}
        run: |
          echo "🔐 Verifying AWS identity..."
          aws sts get-caller-identity
          echo "🌍 Current region: $(aws configure get region)"

      - name: Install CDK CLI (LocalStack for act)
        if: ${{ env.ACT }}
        run: |
          echo "🐳 Installing cdklocal for LocalStack..."
          npm install -g aws-cdk aws-cdk-local

      - name: Install CDK CLI (AWS for GitHub Actions)
        if: ${{ !env.ACT }}
        run: |
          echo "☁️ Installing aws-cdk for AWS..."
          npm install -g aws-cdk

      - name: CDK Bootstrap (LocalStack)
        if: ${{ env.ACT }}
        working-directory: ./infrastructure
        run: |
          echo "🐳 Bootstrapping LocalStack..."
          cdklocal bootstrap --require-approval never || echo "LocalStack bootstrap completed"
        env:
          CDK_LOCAL_BUILD_AND_TEST: true

      - name: CDK Bootstrap (AWS)
        if: ${{ !env.ACT }}
        working-directory: ./infrastructure
        run: |
          echo "☁️ Bootstrapping AWS..."
          npx cdk bootstrap --require-approval never || echo "Already bootstrapped or bootstrap not needed"
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: eu-west-1
          WEB_CERTIFICATE_ID: ${{ secrets.WEB_CERTIFICATE_ID }}

      - name: CDK Deploy Development (LocalStack)
        if: ${{ env.ACT }}
        working-directory: ./infrastructure
        run: |
          echo "🐳 Deploying to LocalStack..."
          cdklocal deploy CatalunyaDataStack-dev \
            --require-approval never \
            --verbose \
            --outputs-file cdk-outputs-dev.json || echo "LocalStack deployment completed (may show warnings)"
        env:
          CDK_LOCAL_BUILD_AND_TEST: true

      - name: CDK Deploy Development (AWS)
        if: ${{ !env.ACT }}
        working-directory: ./infrastructure
        run: |
          echo "☁️ Deploying to AWS..."
          npx cdk deploy CatalunyaDataStack-dev \
            --require-approval never \
            --verbose \
            --outputs-file cdk-outputs-dev.json
          echo "✅ AWS deployment complete!"
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: eu-west-1
          CDK_DEPLOY_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEPLOY_REGION: eu-west-1
          WEB_CERTIFICATE_ID: ${{ secrets.WEB_CERTIFICATE_ID }}

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs-development-${{ github.run_id }}
          path: infrastructure/cdk-outputs-dev.json
          retention-days: 30

      - name: Security - Clear AWS credentials
        if: always()
        run: |
          unset AWS_ACCESS_KEY_ID
          unset AWS_SECRET_ACCESS_KEY
          unset AWS_SESSION_TOKEN

  # ==========================================
  # DEPLOY TO PRODUCTION  
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-and-test, build-rust-lambda ]
    if: |
      needs.detect-changes.outputs.should-deploy-prod == 'true' &&
      needs.detect-changes.outputs.any-cdk == 'true' &&
      needs.build-and-test.result == 'success'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rust Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-lambdas-${{ github.sha }}
          path: .

      - name: Extract Rust Lambda
        run: |
          unzip -o rust_lambda_deployment.zip
          ls -la rust_lambda_deployment
          echo "✅ Extracted Rust lambda artifact!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        working-directory: ./infrastructure
        run: npm ci

      - name: Configure AWS credentials for Production
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/catalunya-deployment-role-prod
          role-session-name: GitHubActions-Production-${{ github.run_id }}
          aws-region: eu-west-1
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Verify AWS identity
        if: ${{ !env.ACT }}
        run: |
          echo "🔐 Verifying AWS identity..."
          aws sts get-caller-identity
          echo "🌍 Current region: $(aws configure get region)"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: CDK Bootstrap (if needed)
        working-directory: ./infrastructure
        run: |
          npx cdk bootstrap --require-approval never || echo "Already bootstrapped or bootstrap not needed"
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: eu-west-1
          WEB_CERTIFICATE_ID: ${{ secrets.WEB_CERTIFICATE_ID }}

      - name: CDK Deploy Production
        working-directory: ./infrastructure
        run: |
          echo "🚀 Deploying to production..."
          npx cdk deploy CatalunyaDataStack-prod \
            --require-approval never \
            --verbose \
            --outputs-file cdk-outputs-prod.json
          echo "✅ Deployment complete!"
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: eu-west-1
          CDK_DEPLOY_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEPLOY_REGION: eu-west-1
          WEB_CERTIFICATE_ID: ${{ secrets.WEB_CERTIFICATE_ID }}

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs-production-${{ github.run_id }}
          path: infrastructure/cdk-outputs-prod.json
          retention-days: 90

      - name: Security - Clear AWS credentials
        if: always()
        run: |
          unset AWS_ACCESS_KEY_ID
          unset AWS_SECRET_ACCESS_KEY
          unset AWS_SESSION_TOKEN

  # ==========================================
  # SECURITY AND COMPLIANCE (PR only)
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-and-test ]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-cdk == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        working-directory: ./infrastructure
        run: npm ci

      - name: Configure AWS credentials for security scan
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/catalunya-deployment-role-dev
          role-session-name: GitHubActions-SecurityScan-${{ github.run_id }}
          aws-region: eu-west-1
          role-duration-seconds: 900
          mask-aws-account-id: true

      - name: Run npm audit
        working-directory: ./infrastructure
        run: npm audit --audit-level moderate

      - name: CDK Security Check
        working-directory: ./infrastructure
        run: |
          npm install -g aws-cdk
          npx cdk synth --all --require-approval never
          echo "CloudFormation templates generated successfully - manual security review recommended"
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: eu-west-1
          WEB_CERTIFICATE_ID: ${{ secrets.WEB_CERTIFICATE_ID }}

      - name: Check for sensitive data in code
        run: |
          echo "🔍 Scanning for potential secrets..."
          if grep -r -i -E "(aws_access_key|aws_secret|password|secret)" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=target .; then
            echo "⚠️ Potential sensitive data found in code"
            exit 1
          else
            echo "✅ No obvious sensitive data found"
          fi
